name: Garder Supabase actif

# Supabase met en pause les projets gratuits après une semaine sans activité.
# Cette tâche fait une petite lecture publique tous les 3 jours pour l'éviter.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lire un resto du catalogue
        run: |
          curl -fsS "https://iorldeqqifkblrurdrmo.supabase.co/rest/v1/restos?select=id&limit=1" \
            -H "apikey: sb_publishable_FUvv-UALWxnRuRSbIeO4Wg_Qwymm9WV"
